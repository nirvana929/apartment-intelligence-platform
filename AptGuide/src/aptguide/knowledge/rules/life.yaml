- doc_id: KB-LIFE-001
  doc_type: flow
  module: life
  title: 入住流程
  content: |
    入住当天的标准流程：
    1. 与门店确认到达时间，准时到达指定门店或公寓；
    2. 出示身份证完成入住登记；
    3. 与门店一起进行房屋交接验收，核对家具家电与房屋状态；
    4. 领取钥匙或绑定智能锁、门禁卡；
    5. 在 App 内登记智能水电表、宽带账号等；
    6. 签署入住交接单，存档备查。
    建议拍照留底房屋初始状态，作为后续退租清算的参考。
  tags: [入住, 流程]
  version: 1
  updated_at: 2026-05-01
  reviewed_by: ops

- doc_id: KB-LIFE-002
  doc_type: guide
  module: life
  title: 钥匙、门禁与智能锁
  content: |
    · 钥匙 / 门禁卡：入住时由门店发放，丢失需自费更换或重新配卡。
    · 智能锁：在 App 内绑定后可使用密码、指纹或临时密码开门；
      授权他人使用时建议使用一次性密码并设置有效期。
    · 公共门禁：通常通过门禁卡或 App 蓝牙开启。
    退租时需归还所有钥匙与门禁卡，未归还的将在押金中相应扣减。
    钥匙或门禁卡丢失，请第一时间联系门店补办。
  tags: [钥匙, 门禁, 智能锁]
  version: 1
  updated_at: 2026-05-01
  reviewed_by: ops

- doc_id: KB-LIFE-003
  doc_type: flow
  module: life
  title: 报修流程
  content: |
    在租期内遇到设施故障，可通过以下方式报修：
    1. 在 App "我的—报修"中提交报修单，描述问题并上传照片；
    2. 选择期望上门时间，提交后会收到工单号；
    3. 维修人员会与你联系确认时间并上门处理；
    4. 维修完成后在 App 内确认完成，可对服务进行评价。
    一般故障在 24 小时内响应；
    紧急故障（如漏水、停电、燃气泄漏）请立刻拨打门店电话或紧急维修热线。
  tags: [报修, 维修]
  version: 1
  updated_at: 2026-05-01
  reviewed_by: ops

- doc_id: KB-LIFE-004
  doc_type: rule
  module: life
  title: 公共设施使用
  content: |
    部分公寓提供公共设施，如健身房、自习室、洗衣房、厨房：
    · 开放时间：以公寓公告为准。
    · 使用规则：保持清洁、不长时间占用、不得用于商业活动。
    · 预约：部分设施需通过 App 预约时段。
    · 损坏赔偿：人为损坏需照价赔偿。
    · 安全：使用电器后请关闭电源，离开前检查门窗。
    具体规则以公寓现场公告与合同附件为准。
  tags: [公共设施, 使用]
  version: 1
  updated_at: 2026-05-01
  reviewed_by: ops

- doc_id: KB-LIFE-005
  doc_type: guide
  module: life
  title: 物业与社区服务
  content: |
    日常服务由门店与物业共同提供：
    · 保洁：公共区域定期保洁；房间内保洁可在 App 单独预约付费服务。
    · 安保：24 小时门禁与安保巡逻。
    · 快递：在公寓前台或快递柜领取，部分公寓支持代收。
    · 投诉与建议：可通过 App "意见反馈"提交，运营会在 3 个工作日内回应。
    · 邻里纠纷：建议先沟通；如无法解决可联系门店协调。
  tags: [物业, 社区服务]
  version: 1
  updated_at: 2026-05-01
  reviewed_by: ops
