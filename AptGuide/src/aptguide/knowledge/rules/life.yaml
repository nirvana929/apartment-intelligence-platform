- doc_id: KB-LIFE-001
  doc_type: flow
  module: life
  title: 入住流程
  content: |
    入住当天的标准流程：
    1. 与门店确认到达时间，准时到达指定门店或公寓；
    2. 出示身份证完成入住登记；
    3. 与门店一起进行房屋交接验收，核对家具家电与房屋状态；
    4. 领取钥匙或绑定智能锁、门禁卡；
    5. 在 App 内登记智能水电表、宽带账号等；
    6. 签署入住交接单，存档备查。
    建议拍照留底房屋初始状态，作为后续退租清算的参考。
  tags: [入住, 流程]
  version: 1
  updated_at: 2026-05-01
  reviewed_by: ops

- doc_id: KB-LIFE-002
  doc_type: guide
  module: life
  title: 钥匙、门禁与智能锁
  content: |
    · 钥匙 / 门禁卡：入住时由门店发放，丢失需自费更换或重新配卡。
    · 智能锁：在 App 内绑定后可使用密码、指纹或临时密码开门；
      授权他人使用时建议使用一次性密码并设置有效期。
    · 公共门禁：通常通过门禁卡或 App 蓝牙开启。
    退租时需归还所有钥匙与门禁卡，未归还的将在押金中相应扣减。
    钥匙或门禁卡丢失，请第一时间联系门店补办。
  tags: [钥匙, 门禁, 智能锁]
  version: 1
  updated_at: 2026-05-01
  reviewed_by: ops

- doc_id: KB-LIFE-003
  doc_type: flow
  module: life
  title: 报修流程
  content: |
    在租期内遇到设施故障，可通过以下方式报修：
    1. 在 App "我的—报修"中提交报修单，描述问题并上传照片；
    2. 选择期望上门时间，提交后会收到工单号；
    3. 维修人员会与你联系确认时间并上门处理；
    4. 维修完成后在 App 内确认完成，可对服务进行评价。
    一般故障在 24 小时内响应；
    紧急故障（如漏水、停电、燃气泄漏）请立刻拨打门店电话或紧急维修热线。
  tags: [报修, 维修]
  version: 1
  updated_at: 2026-05-01
  reviewed_by: ops

- doc_id: KB-LIFE-004
  doc_type: rule
  module: life
  title: 公共设施使用
  content: |
    部分公寓提供公共设施，如健身房、自习室、洗衣房、厨房：
    · 开放时间：以公寓公告为准。
    · 使用规则：保持清洁、不长时间占用、不得用于商业活动。
    · 预约：部分设施需通过 App 预约时段。
    · 损坏赔偿：人为损坏需照价赔偿。
    · 安全：使用电器后请关闭电源，离开前检查门窗。
    具体规则以公寓现场公告与合同附件为准。
  tags: [公共设施, 使用]
  version: 1
  updated_at: 2026-05-01
  reviewed_by: ops

- doc_id: KB-LIFE-005
  doc_type: guide
  module: life
  title: 物业与社区服务
  content: |
    日常服务由门店与物业共同提供：
    · 保洁：公共区域定期保洁；房间内保洁可在 App 单独预约付费服务。
    · 安保：24 小时门禁与安保巡逻。
    · 快递：在公寓前台或快递柜领取，部分公寓支持代收。
    · 投诉与建议：可通过 App "意见反馈"提交，运营会在 3 个工作日内回应。
    · 邻里纠纷：建议先沟通；如无法解决可联系门店协调。
  tags: [物业, 社区服务]
  version: 1
  updated_at: 2026-05-01
  reviewed_by: ops

- doc_id: KB-LIFE-006
  doc_type: faq
  module: life
  title: 快递和外卖收取
  content: |
    关于快递和外卖收取：
    · 快递：通常放在公寓快递柜或前台，凭取件码领取。
    · 大件快递：可能需要到前台签收，前台会通知领取。
    · 外卖：一般放在外卖架或前台指定区域，建议及时取走。
    · 贵重物品：建议本人签收，不要放在公共区域。
    · 代收服务：部分公寓支持前台代收，以公寓公告为准。
    快递丢失或损坏，建议先联系快递公司，门店可协助配合调查。
  tags: [快递, 外卖, 收取]
  version: 1
  updated_at: 2026-05-02
  reviewed_by: ops

- doc_id: KB-LIFE-007
  doc_type: guide
  module: life
  title: 房间内设施使用指南
  content: |
    入住后常见设施的使用建议：
    · 空调：使用前检查滤网是否清洁，长时间不用建议断电。
    · 热水器：首次使用先排气，设定温度不宜过高。
    · 洗衣机：使用前清理口袋杂物，定期运行筒清洁程序。
    · 油烟机：做饭时开启，定期清洗滤网。
    · 门锁/智能锁：定期检查电池电量，低电量时及时更换。
    如设施出现故障，请通过 App 报修流程提交，不要自行拆卸维修。
  tags: [设施, 使用, 指南]
  version: 1
  updated_at: 2026-05-02
  reviewed_by: ops

- doc_id: KB-LIFE-008
  doc_type: flow
  module: life
  title: 退房交房流程
  content: |
    退房交房的标准步骤：
    1. 提前通知门店退房日期，约定交房时间；
    2. 清理个人物品，打扫房间卫生；
    3. 与门店一起验收房屋，核对家具家电与入住时一致；
    4. 水电气抄表，确认最终读数；
    5. 归还钥匙、门禁卡等；
    6. 门店出具退租清算单，双方确认签字。
    建议入住时拍照留底，方便退房时对比房屋状态。
    如有争议，可申请门店主管到场复核。
  tags: [退房, 交房, 验收]
  version: 1
  updated_at: 2026-05-02
  reviewed_by: ops

- doc_id: KB-LIFE-009
  doc_type: faq
  module: life
  title: 搬家和大件物品进出
  content: |
    关于搬家和大件物品进出：
    · 入住搬家：建议提前告知门店，确认电梯使用与搬运通道。
    · 日常大件进出：搬入家具家电等大件物品前，请通知前台以便安排电梯。
    · 搬运时间：建议避开早晚高峰与安静时段（22:00—08:00）。
    · 公共区域保护：搬运时注意不损坏走廊墙面、电梯等公共设施。
    · 损坏赔偿：搬运过程中造成公共区域损坏的需照价赔偿。
    如需使用货梯或特殊通道，请提前与门店确认。
  tags: [搬家, 大件, 搬运]
  version: 1
  updated_at: 2026-05-02
  reviewed_by: ops

- doc_id: KB-LIFE-010
  doc_type: guide
  module: life
  title: 节假日和特殊时期的物业服务
  content: |
    节假日期间的物业服务安排：
    · 国家法定节假日：物业与门店可能调整值班时间，以提前公告为准。
    · 紧急维修：节假日仍有紧急维修值班，漏水、停电等可拨打紧急电话。
    · 常规报修：节假日期间的非紧急报修可能延迟至工作日处理。
    · 快递收取：快递柜正常运行，前台代收服务以公寓安排为准。
    · 安保服务：24 小时安保不受节假日影响。
    具体安排以公寓节前公告为准，建议提前关注通知。
  tags: [节假日, 物业, 服务]
  version: 1
  updated_at: 2026-05-02
  reviewed_by: ops
