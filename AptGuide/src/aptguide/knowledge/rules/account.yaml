- doc_id: KB-ACCT-001
  doc_type: faq
  module: account
  title: 注册与实名认证
  content: |
    用户可以使用手机号注册并登录。首次使用涉及签约、预约、租约查看等功能时，可能需要按页面提示完成实名认证。
    实名认证信息仅用于身份核验和租约相关服务，不会在智能助手回答中展示。
    认证方式以 App 内页面提示为准，通常需要提供姓名与证件信息。
    如认证失败，请检查信息是否与证件一致，或联系客服协助处理。
  tags: [注册, 实名, 认证]
  version: 1
  updated_at: 2026-05-02
  reviewed_by: ops

- doc_id: KB-ACCT-002
  doc_type: faq
  module: account
  title: 手机号注册登录
  content: |
    支持使用手机号快速注册和登录：
    1. 输入手机号，获取短信验证码；
    2. 输入验证码后自动登录，新用户会同步创建账号；
    3. 登录后可在"账号设置"中补充昵称、头像等信息。
    如收不到验证码，请检查手机信号与短信拦截设置，稍后重试。
    验证码有效期为 5 分钟，过期需重新获取。
  tags: [手机号, 登录, 验证码]
  version: 1
  updated_at: 2026-05-02
  reviewed_by: ops

- doc_id: KB-ACCT-003
  doc_type: guide
  module: account
  title: 修改个人信息
  content: |
    在"我的—账号设置"中可修改以下信息：
    · 昵称、头像：随时可改。
    · 联系方式：更换绑定手机号需通过短信验证。
    · 紧急联系人：可添加或修改，用于紧急情况联络。
    修改完成后会即时生效。
    如需修改实名认证信息，请联系客服，提供相关证明材料后由工作人员处理。
  tags: [个人信息, 修改, 设置]
  version: 1
  updated_at: 2026-05-02
  reviewed_by: ops

- doc_id: KB-ACCT-004
  doc_type: flow
  module: account
  title: 绑定和更换手机号
  content: |
    更换绑定手机号的步骤：
    1. 进入"我的—账号设置—手机号"；
    2. 使用当前手机号接收验证码验证身份；
    3. 输入新手机号并完成短信验证；
    4. 更换成功后新手机号即为登录账号。
    如原手机号已无法接收验证码，请联系客服协助更换，
    可能需要提供实名信息与相关证明。
    更换手机号不影响已有的租约与订单数据。
  tags: [手机号, 更换, 绑定]
  version: 1
  updated_at: 2026-05-02
  reviewed_by: ops

- doc_id: KB-ACCT-005
  doc_type: policy
  module: account
  title: 隐私和数据保护
  content: |
    平台重视用户隐私，关于数据保护的基本原则：
    · 个人信息仅用于提供租房相关服务，不会出售给第三方。
    · AI 助手的对话内容仅用于回答当次问题，不会用于用户画像或广告推荐。
    · 实名信息、合同信息等敏感数据加密存储，访问受权限控制。
    · 用户可在"隐私设置"中管理数据授权与分享范围。
    如需了解完整的隐私政策，可在 App 内"关于我们—隐私政策"中查看。
  tags: [隐私, 数据保护, 安全]
  version: 1
  updated_at: 2026-05-02
  reviewed_by: ops

- doc_id: KB-ACCT-006
  doc_type: guide
  module: account
  title: 账号安全与密码管理
  content: |
    保障账号安全的建议：
    · 使用短信验证码登录时，请勿将验证码告知他人。
    · 如 App 支持设置登录密码，请使用包含字母与数字的组合，并定期更换。
    · 发现账号异常登录或操作时，请立即修改密码并联系客服。
    · 在公共设备上使用后请退出登录。
    · 绑定手机号是找回账号的主要方式，请确保手机号有效。
  tags: [安全, 密码, 账号保护]
  version: 1
  updated_at: 2026-05-02
  reviewed_by: ops

- doc_id: KB-ACCT-007
  doc_type: flow
  module: account
  title: 注销账号
  content: |
    如需注销账号，请注意：
    · 有生效中的租约时不支持注销，需先完成退租流程。
    · 有未完成的订单或待处理退款时暂不支持注销。
    · 注销路径：在"我的—账号设置—注销账号"中提交申请。
    · 提交后有 15 天冷静期，期间可撤回；冷静期结束后账号数据将被删除。
    · 注销后同一手机号可在 30 天后重新注册。
    注销前建议备份重要信息，如缴费记录、合同副本等。
  tags: [注销, 账号, 删除]
  version: 1
  updated_at: 2026-05-02
  reviewed_by: ops

- doc_id: KB-ACCT-008
  doc_type: faq
  module: account
  title: 多设备登录管理
  content: |
    关于多设备登录：
    · 同一账号最多支持在 2 台设备上同时登录。
    · 超出限制时，最早登录的设备会被自动退出。
    · 在"我的—账号设置—登录设备"中可查看当前登录的设备列表。
    · 如发现陌生设备，可手动将其退出并立即修改密码。
    退出设备后，该设备上的本地缓存（如浏览历史）会被清除。
  tags: [多设备, 登录, 安全]
  version: 1
  updated_at: 2026-05-02
  reviewed_by: ops
