# 模块：看房预约
# 前缀：KB-APT-

- doc_id: KB-APT-001
  doc_type: flow
  module: appointment
  title: 怎么预约看房
  content: |
    预约看房有两种方式：
    1. 房源详情页：点击"预约看房"按钮，选择日期与时段后提交。
    2. AI 找房助手：在对话中说"帮我预约 X 房间 X 时间看房"，
       助手会先返回预约摘要，等你确认后才会正式提交。
    提交成功后会收到预约号与门店联系方式，并在"我的—我的预约"中查看。
    预约前请确保账号已完成实名认证，否则提交会被拒绝。
  tags: [预约, 流程]
  version: 1
  updated_at: 2026-05-01
  reviewed_by: ops

- doc_id: KB-APT-002
  doc_type: rule
  module: appointment
  title: 预约时间和门店开放时间
  content: |
    · 可预约时段：每天 09:00 — 18:00，每 30 分钟为一个时段。
    · 提前预约：建议提前至少 4 小时；当日 30 分钟内的时段可能无法选择。
    · 最远预约：可预约未来 7 天内的时段。
    · 国家法定节假日的开放时间以门店公告为准。
    预约前如门店临时调整时间，会通过短信或站内消息提前通知。
  tags: [时间, 时段, 开放时间]
  version: 1
  updated_at: 2026-05-01
  reviewed_by: ops

- doc_id: KB-APT-003
  doc_type: rule
  module: appointment
  title: 修改和取消预约
  content: |
    · 修改时间：可在预约时段开始前 2 小时之前修改，进入"我的—我的预约"操作。
    · 取消预约：可在预约时段开始前 2 小时之前免费取消。
    · 临近时间未取消视为爽约，连续 3 次爽约会暂时限制预约功能 7 天。
    · AI 助手暂不支持改期与取消（第二版上线），请通过 App 操作或联系门店。
    如确需紧急调整，请直接联系门店电话。
  tags: [改期, 取消, 爽约]
  version: 1
  updated_at: 2026-05-01
  reviewed_by: ops

- doc_id: KB-APT-004
  doc_type: faq
  module: appointment
  title: 预约失败的常见原因
  content: |
    常见失败原因与处理：
    · 房源已下架或已签约：刷新房源列表，选择其他房源。
    · 时段已被预约满：选择其他时段或换一天。
    · 同时段已存在你自己的预约：建议先处理已有预约。
    · 未实名认证：先到"我的—账号设置"完成实名。
    · 超出可预约时间窗（4 小时内 / 7 天外）：调整为合法时段。
    若以上都不符合仍失败，请联系门店或客服。
  tags: [失败, 原因]
  version: 1
  updated_at: 2026-05-01
  reviewed_by: ops

- doc_id: KB-APT-005
  doc_type: guide
  module: appointment
  title: 看房当天需要带什么
  content: |
    建议携带：
    · 本人身份证（用于现场登记与后续签约）
    · 用于记录的手机或纸笔
    · 如需当场签约，准备首期房租与押金的支付方式（电子或银行卡）
    门店会有专人在约定时间接待。如临近时间无法到达，
    请尽量在预约时段开始前 2 小时之前修改或取消，避免影响他人。
  tags: [看房, 准备]
  version: 1
  updated_at: 2026-05-01
  reviewed_by: ops

- doc_id: KB-APT-006
  doc_type: faq
  module: appointment
  title: 可以委托他人代看房吗
  content: |
    支持委托代看，需在预约备注中注明代看人姓名与联系方式。
    代看人需在现场出示本人身份证以便门店登记。
    如果后续由代看人签约，需提供签约人本人的授权委托书与双方身份证原件。
    如签约人本人无法到场签约，建议先咨询门店，确认所需材料后再前往。
  tags: [代看, 委托]
  version: 1
  updated_at: 2026-05-01
  reviewed_by: ops
