# 前缀：KB-POL-

- doc_id: KB-POL-001
  doc_type: policy
  module: policy
  title: 同住人规则
  content: |
    关于同住人的规定：
    · 签约人可在合同中登记同住人，同住人需提供身份信息。
    · 同住人数量以合同约定为准，通常不超过房间设计居住人数。
    · 同住人变更（新增或搬离）需提前通知门店并更新登记。
    · 同住人不单独享有租约权利，租约相关事务由签约人负责。
    · 部分公寓对同住人有额外要求，以门店告知为准。
  tags: [同住人, 登记, 规则]
  version: 1
  updated_at: 2026-05-02
  reviewed_by: ops

- doc_id: KB-POL-002
  doc_type: policy
  module: policy
  title: 宠物政策
  content: |
    关于饲养宠物的规定：
    · 是否允许养宠物以具体公寓政策为准，部分公寓明确禁止。
    · 允许养宠的公寓通常对宠物类型、体型、数量有限制，签约前请确认。
    · 饲养宠物需遵守公寓公约，包括清理排泄物、控制噪音、使用牵引绳等。
    · 宠物造成房屋或公共设施损坏的，需照价赔偿。
    · 违反宠物政策且经提醒不改的，门店有权依合同处理。
  tags: [宠物, 政策, 公寓]
  version: 1
  updated_at: 2026-05-02
  reviewed_by: ops

- doc_id: KB-POL-003
  doc_type: policy
  module: policy
  title: 装修和软装变更
  content: |
    关于房间内装修和软装变更：
    · 不得进行结构性改动，包括拆除墙体、改变管线、封堵门窗等。
    · 墙面打孔、贴墙纸等软装变更需提前向门店报备并获得同意。
    · 退租时需将房间恢复至入住前状态，未恢复的可能产生恢复费用。
    · 自行添置的家具家电退租时需自行搬离，遗弃物品门店将按废弃物处理。
    · 具体限制以合同附件中的"房屋使用规范"为准。
  tags: [装修, 软装, 变更]
  version: 1
  updated_at: 2026-05-02
  reviewed_by: ops

- doc_id: KB-POL-004
  doc_type: policy
  module: policy
  title: 安全与禁止事项
  content: |
    为保障全体住户安全，以下行为严格禁止：
    · 在房间内存放易燃易爆、有毒有害等危险物品。
    · 私拉电线、超负荷使用电器。
    · 堵塞消防通道、损坏消防设施。
    · 在禁烟区域吸烟。
    · 使用明火（蜡烛、酒精炉等）进行非炊事活动。
    · 高空抛物。
    违反安全规定的，门店有权立即处理并依合同追究责任。
  tags: [安全, 禁止, 消防]
  version: 1
  updated_at: 2026-05-02
  reviewed_by: ops

- doc_id: KB-POL-005
  doc_type: policy
  module: policy
  title: 退租清算细则
  content: |
    退租时的清算包含以下项目：
    · 房租：结清至退租日的剩余房租。
    · 水电燃气：以退租当日抄表读数为准结算。
    · 物业/服务费：结清至退租日。
    · 房屋损耗：正常使用磨损不扣费；人为损坏或明显污损按维修或清洁标准扣减。
    · 钥匙/门禁卡：未归还的按补办费用扣减。
    清算单由门店出具，租客确认后签字。押金在扣除应付款项后退还。
    对清算有异议的，可在签字前申请复核。
  tags: [退租, 清算, 押金]
  version: 1
  updated_at: 2026-05-02
  reviewed_by: ops

- doc_id: KB-POL-006
  doc_type: rule
  module: policy
  title: 噪音和作息公约
  content: |
    为维护良好的居住环境：
    · 每日 22:00 至次日 08:00 为安静时段，请降低音量。
    · 安静时段内不得进行装修、大声播放音乐、聚会等产生噪音的活动。
    · 白天活动也请注意音量，避免长时间影响邻居。
    · 装修施工仅限工作日 09:00—12:00、14:00—18:00，需提前报备。
    · 多次违反噪音公约且不配合整改的，门店有权依合同处理。
  tags: [噪音, 作息, 公约]
  version: 1
  updated_at: 2026-05-02
  reviewed_by: ops

- doc_id: KB-POL-007
  doc_type: rule
  module: policy
  title: 公共区域使用守则
  content: |
    公共区域包括走廊、电梯、大堂、公共厨房、洗衣房等：
    · 保持整洁，不堆放私人物品、鞋架、杂物。
    · 垃圾请投入指定垃圾点，不放在走廊或门口。
    · 公共厨房使用后请清洁台面与器具。
    · 洗衣房衣物洗涤完成后请及时取走，超时未取的可能被移至暂存区。
    · 公共区域不得吸烟、遛宠物、进行商业活动。
    违反守则经提醒不改的，可能影响租约续签。
  tags: [公共区域, 守则, 清洁]
  version: 1
  updated_at: 2026-05-02
  reviewed_by: ops

- doc_id: KB-POL-008
  doc_type: rule
  module: policy
  title: 访客管理规定
  content: |
    关于访客的管理规定：
    · 访客需在公寓前台或 App 中登记，出示有效证件。
    · 访客访问时间通常为 08:00—22:00，超时需提前向门店报备。
    · 访客不得留宿，如需留宿需提前通知门店并按公寓规定办理。
    · 访客应遵守公寓公共规则，违规责任由邀请住户承担。
    · 部分公寓对每日访客数量有上限，以公寓公告为准。
  tags: [访客, 登记, 管理]
  version: 1
  updated_at: 2026-05-02
  reviewed_by: ops

- doc_id: KB-POL-009
  doc_type: policy
  module: policy
  title: 禁止转租和群租
  content: |
    以下行为明确禁止：
    · 未经平台和门店书面同意，不得将房间转租、转借给他人。
    · 不得将房间用于经营性用途（如民宿短租、工作室等）。
    · 不得超出合同约定的人数居住（群租）。
    · 违反上述规定的，门店有权解除合同并要求搬离。
    · 因转租或群租造成房屋损坏或邻里纠纷的，由签约人承担全部责任。
  tags: [转租, 群租, 禁止]
  version: 1
  updated_at: 2026-05-02
  reviewed_by: ops

- doc_id: KB-POL-010
  doc_type: flow
  module: policy
  title: 投诉与纠纷处理
  content: |
    如遇到问题或纠纷，可按以下途径处理：
    1. 优先与相关方直接沟通协商；
    2. 无法协商的，通过 App "意见反馈"提交投诉，运营会在 3 个工作日内响应；
    3. 门店会安排专人调查并出具处理方案；
    4. 对处理方案不满意的，可向上级运营团队申诉。
    · 投诉时请提供时间、地点、事件描述与相关证据（照片、截图等）。
    · 门店对投诉人的信息严格保密，不会向被投诉方透露。
  tags: [投诉, 纠纷, 处理]
  version: 1
  updated_at: 2026-05-02
  reviewed_by: ops
