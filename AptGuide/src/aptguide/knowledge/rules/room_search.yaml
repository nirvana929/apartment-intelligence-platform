# 前缀：KB-RS-

- doc_id: KB-RS-001
  doc_type: guide
  module: room_search
  title: 怎么搜索房源
  content: |
    在 App 首页可通过两种方式找房：
    1. 顶部搜索框输入区域、地铁站、公寓名或关键词，例如"天河区"、"3 号线"。
    2. 使用筛选条件按价格、户型、租期、支付方式、配套精确查询。
    也可以直接告诉 AI 找房助手你的需求，例如"3000 以内、天河区、月付"，
    助手会综合显式条件与模糊偏好（如"安静"、"通勤方便"）为你推荐房源。
    所有展示的房源都已校验为"上架可预约"状态；如对结果不满意，可继续追加条件。
  tags: [找房, 入门, 搜索]
  version: 1
  updated_at: 2026-05-01
  reviewed_by: ops

- doc_id: KB-RS-002
  doc_type: rule
  module: room_search
  title: 房源筛选条件有哪些
  content: |
    支持的筛选维度：
    · 区域：城市、行政区、商圈、地铁线 / 站点
    · 价格：月租金区间（以元为单位）
    · 户型：一居 / 两居 / 三居 / 合租单间
    · 面积：平方米区间
    · 朝向：南 / 北 / 东 / 西 / 东南 等
    · 楼层：低 / 中 / 高
    · 租期：3 / 6 / 12 个月或自定义
    · 支付方式：月付 / 季付 / 半年付 / 年付
    · 配套：独卫、空调、电梯、洗衣机、厨房、阳台等
    · 标签：朝南、近地铁、采光好、新装修等
    多个条件之间为"与"关系；同一维度多个值为"或"关系。
  tags: [筛选, 条件]
  version: 1
  updated_at: 2026-05-01
  reviewed_by: ops

- doc_id: KB-RS-003
  doc_type: faq
  module: room_search
  title: 房源标签是什么意思
  content: |
    房源标签是对房源特点的简短描述，便于快速判断是否符合需求。常见标签：
    · "近地铁"：距最近地铁站步行 ≤ 800 米
    · "新装修"：当年内重新装修或翻新
    · "采光好"：朝南或大窗户房型
    · "独卫"：房间内有独立卫生间
    · "拎包入住"：家电家具齐全可直接入住
    · "可月付"：支持按月支付租金
    · "押一付一"：押金一个月、租金一次付一个月
    标签由门店运营维护，最终以房源详情页面与合同条款为准。
  tags: [标签, 含义]
  version: 1
  updated_at: 2026-05-01
  reviewed_by: ops

- doc_id: KB-RS-004
  doc_type: guide
  module: room_search
  title: 按区域和地铁找房
  content: |
    区域筛选支持两层结构：先选城市，再选行政区或商圈。多个商圈可同时选择。
    地铁筛选支持按线路或单个站点；选择站点后会显示步行距离。
    如果你只关心通勤目的地（如公司位置），可在 AI 助手中直接说明，
    例如"通勤到珠江新城"，助手会综合地铁线路与距离推荐房源。
    精确的通勤时间需结合实际线路，建议搭配地图工具二次确认。
  tags: [区域, 地铁, 通勤]
  version: 1
  updated_at: 2026-05-01
  reviewed_by: ops

- doc_id: KB-RS-005
  doc_type: guide
  module: room_search
  title: 收藏房源与浏览历史
  content: |
    · 收藏：在房源详情页点击"收藏"图标，可在"我的—我的收藏"中查看。
    · 浏览历史：系统自动记录最近 30 天访问过的房源，可在"我的—浏览历史"中查看。
    · 浏览历史仅对你本人可见，不会展示给其他用户或门店运营。
    AI 找房助手可以基于你的浏览历史推荐相似房源，
    在对话中说"根据我最近看过的推荐几个类似的"即可。
    如需清除浏览历史，可在浏览历史页面手动删除单条或全部记录。
  tags: [收藏, 浏览历史, 个性化]
  version: 1
  updated_at: 2026-05-01
  reviewed_by: ops

- doc_id: KB-RS-006
  doc_type: faq
  module: room_search
  title: 房源信息多久更新一次
  content: |
    房源状态（是否可租、价格、户型）由门店运营人员维护，更新规则：
    · 房源被签约后，状态会在 1 小时内更新为"已租出"。
    · 新房源上架后可立即在列表中搜索到。
    · 价格调整、配套设施变更等信息由门店手动更新。
    如发现房源信息与实际不符，可在房源详情页点击"反馈"告知我们。
    信息准确性以门店现场确认为准。
  tags: [更新, 时效, 准确性]
  version: 1
  updated_at: 2026-05-02
  reviewed_by: ops

- doc_id: KB-RS-007
  doc_type: faq
  module: room_search
  title: 为什么搜索结果为空
  content: |
    搜索无结果的常见原因：
    · 筛选条件过严：尝试放宽价格范围、面积或户型等条件。
    · 关键词过于具体：如搜索具体房间号，可改为搜索公寓名或区域。
    · 当前区域暂无房源：该区域可能暂时没有可租房源。
    · 房源已全部被预约：热门区域房源紧张，建议扩大搜索范围。
    可以在 AI 助手中描述需求，助手会推荐最接近的替代方案。
  tags: [搜索, 无结果, 筛选]
  version: 1
  updated_at: 2026-05-02
  reviewed_by: ops

- doc_id: KB-RS-008
  doc_type: guide
  module: room_search
  title: 房源详情页包含哪些信息
  content: |
    房源详情页通常包含：
    · 基本信息：户型、面积、楼层、朝向
    · 租金与支付方式：月租金、押金比例、支持的付租周期
    · 配套设施：家电家具清单、网络、门禁类型
    · 房源标签与亮点：如"近地铁""拎包入住"等
    · 位置与交通：所在商圈、最近地铁站及步行距离
    · 照片与视频：房间实拍图、户型图、公区展示
    · 预约入口：可直接预约看房
    具体信息丰富度以门店录入情况为准。
  tags: [详情页, 信息, 房源]
  version: 1
  updated_at: 2026-05-02
  reviewed_by: ops

- doc_id: KB-RS-009
  doc_type: guide
  module: room_search
  title: 如何使用 AI 助手找房
  content: |
    AI 找房助手支持自然语言描述需求，例如：
    · "天河区 3000 以内的两居室"
    · "通勤到珠江新城，地铁 30 分钟以内"
    · "带独卫、可月付、拎包入住的单间"
    助手会综合你的显式条件与模糊偏好，返回匹配的房源列表。
    你可以继续追问"有没有更便宜的""换一个朝南的"来调整结果。
    AI 助手推荐的房源均为平台上架可预约的真实房源。
  tags: [AI助手, 找房, 自然语言]
  version: 1
  updated_at: 2026-05-02
  reviewed_by: ops

- doc_id: KB-RS-010
  doc_type: rule
  module: room_search
  title: 价格区间与租金说明
  content: |
    关于租金的说明：
    · 展示的月租金为该房源的基础租金，不含水电燃气、物业费等。
    · 实际租金可能因支付方式不同而有差异（如年付可能有优惠）。
    · 同一户型不同楼层、朝向的租金可能不同。
    · 促销优惠、活动折扣以签约时的实际报价为准。
    如需了解某房源的完整费用明细，可在 AI 助手中询问
    或联系门店获取详细报价单。
  tags: [价格, 租金, 费用]
  version: 1
  updated_at: 2026-05-02
  reviewed_by: ops
