- doc_id: KB-PAY-001
  doc_type: rule
  module: payment
  title: 支付方式（月付/季付/半年付/年付）
  content: |
    平台支持以下支付方式，具体可选项以房源详情为准：
    · 月付：每月支付一次房租，资金压力较小。
    · 季付：每三个月支付一次。
    · 半年付：每六个月支付一次。
    · 年付：一次性支付全年房租，部分房源可享租金优惠。
    不同支付方式可能对应不同的押金比例与服务费。
    如想了解某房源支持哪些支付方式，可在房源详情查看，
    或在 AI 助手中说"这个房源支持月付吗"。
  tags: [支付方式, 月付, 季付]
  version: 1
  updated_at: 2026-05-01
  reviewed_by: ops

- doc_id: KB-PAY-002
  doc_type: rule
  module: payment
  title: 押金规则
  content: |
    常见押金规则：
    · 押一付一：押金一个月房租 + 一次支付一个月。
    · 押一付三：押金一个月房租 + 一次支付三个月。
    · 押二付一：押金两个月房租 + 一次支付一个月。
    具体押金比例以房源详情和合同为准。
    押金在退租清算后按合同约定时限退还到原支付账户，
    如有损坏赔偿、欠费等需要扣减，会在清算单中列明。
  tags: [押金, 押一付一]
  version: 1
  updated_at: 2026-05-01
  reviewed_by: ops

- doc_id: KB-PAY-003
  doc_type: rule
  module: payment
  title: 房租缴费时间和滞纳金
  content: |
    · 缴费日：通常为每个支付周期的起算日（如月付为每月对应日）。
    · 提醒：到期前 7 天和 3 天会通过 App 与短信提醒。
    · 宽限期：到期日起 3 个自然日内补缴不视为逾期。
    · 滞纳金：超过宽限期后按合同约定计收，常见为日万分之五。
    · 长期欠费：连续欠费超过合同约定天数的，门店可依约处理租约。
    具体金额与天数以合同为准；如缴费遇到问题请尽快联系门店。
  tags: [缴费, 滞纳金]
  version: 1
  updated_at: 2026-05-01
  reviewed_by: ops

- doc_id: KB-PAY-004
  doc_type: rule
  module: payment
  title: 水电网燃气费用
  content: |
    水、电、燃气、宽带费用通常由租客自行承担，常见模式：
    · 智能表实时计费：通过 App 查看用量并在线缴费；
    · 月度抄表：门店每月抄表后在 App 推送账单；
    · 包含在租金内：少量房源把基础水电包含在租金中，详见房源说明。
    宽带是否预装、是否需要单独报装，请以房源描述为准。
    具体单价（电费 / 水费）按当地市政公告与合同附件执行。
  tags: [水电, 燃气, 宽带]
  version: 1
  updated_at: 2026-05-01
  reviewed_by: ops

- doc_id: KB-PAY-005
  doc_type: rule
  module: payment
  title: 服务费与管理费
  content: |
    部分房源会收取以下费用：
    · 服务费：覆盖签约、入住、退租等服务，通常一次性收取或按月收取。
    · 物业 / 管理费：用于公共区域维护、安保、保洁等。
    · 网络 / 智能设备费：如门禁、智能锁、共享设备维护。
    具体项目与金额以合同与缴费明细为准。
    如对账单上的某一项费用有疑问，可在 App 内提交咨询或联系门店。
  tags: [服务费, 管理费]
  version: 1
  updated_at: 2026-05-01
  reviewed_by: ops

- doc_id: KB-PAY-006
  doc_type: guide
  module: payment
  title: 支付渠道与发票
  content: |
    · 支付渠道：支持微信支付、支付宝、银行卡、企业转账等，具体以 App 内可选项为准。
    · 缴费记录：在"我的—缴费记录"查看所有历史账单与缴费状态。
    · 发票：可通过 App 提交开票申请，电子发票一般在 5 个工作日内开具。
    · 抬头与税号：开票前请准备好抬头、纳税人识别号，企业用户还需开户行与账号。
    如发票信息错误，请在收到发票后及时申请重开。
  tags: [支付渠道, 发票]
  version: 1
  updated_at: 2026-05-01
  reviewed_by: ops
