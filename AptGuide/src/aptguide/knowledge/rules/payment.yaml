- doc_id: KB-PAY-001
  doc_type: rule
  module: payment
  title: 支付方式（月付/季付/半年付/年付）
  content: |
    平台支持以下支付方式，具体可选项以房源详情为准：
    · 月付：每月支付一次房租，资金压力较小。
    · 季付：每三个月支付一次。
    · 半年付：每六个月支付一次。
    · 年付：一次性支付全年房租，部分房源可享租金优惠。
    不同支付方式可能对应不同的押金比例与服务费。
    如想了解某房源支持哪些支付方式，可在房源详情查看，
    或在 AI 助手中说"这个房源支持月付吗"。
  tags: [支付方式, 月付, 季付]
  version: 1
  updated_at: 2026-05-01
  reviewed_by: ops

- doc_id: KB-PAY-002
  doc_type: rule
  module: payment
  title: 押金规则
  content: |
    常见押金规则：
    · 押一付一：押金一个月房租 + 一次支付一个月。
    · 押一付三：押金一个月房租 + 一次支付三个月。
    · 押二付一：押金两个月房租 + 一次支付一个月。
    具体押金比例以房源详情和合同为准。
    押金在退租清算后按合同约定时限退还到原支付账户，
    如有损坏赔偿、欠费等需要扣减，会在清算单中列明。
  tags: [押金, 押一付一]
  version: 1
  updated_at: 2026-05-01
  reviewed_by: ops

- doc_id: KB-PAY-003
  doc_type: rule
  module: payment
  title: 房租缴费时间和滞纳金
  content: |
    · 缴费日：通常为每个支付周期的起算日（如月付为每月对应日）。
    · 提醒：到期前 7 天和 3 天会通过 App 与短信提醒。
    · 宽限期：到期日起 3 个自然日内补缴不视为逾期。
    · 滞纳金：超过宽限期后按合同约定计收，常见为日万分之五。
    · 长期欠费：连续欠费超过合同约定天数的，门店可依约处理租约。
    具体金额与天数以合同为准；如缴费遇到问题请尽快联系门店。
  tags: [缴费, 滞纳金]
  version: 1
  updated_at: 2026-05-01
  reviewed_by: ops

- doc_id: KB-PAY-004
  doc_type: rule
  module: payment
  title: 水电网燃气费用
  content: |
    水、电、燃气、宽带费用通常由租客自行承担，常见模式：
    · 智能表实时计费：通过 App 查看用量并在线缴费；
    · 月度抄表：门店每月抄表后在 App 推送账单；
    · 包含在租金内：少量房源把基础水电包含在租金中，详见房源说明。
    宽带是否预装、是否需要单独报装，请以房源描述为准。
    具体单价（电费 / 水费）按当地市政公告与合同附件执行。
  tags: [水电, 燃气, 宽带]
  version: 1
  updated_at: 2026-05-01
  reviewed_by: ops

- doc_id: KB-PAY-005
  doc_type: rule
  module: payment
  title: 服务费与管理费
  content: |
    部分房源会收取以下费用：
    · 服务费：覆盖签约、入住、退租等服务，通常一次性收取或按月收取。
    · 物业 / 管理费：用于公共区域维护、安保、保洁等。
    · 网络 / 智能设备费：如门禁、智能锁、共享设备维护。
    具体项目与金额以合同与缴费明细为准。
    如对账单上的某一项费用有疑问，可在 App 内提交咨询或联系门店。
  tags: [服务费, 管理费]
  version: 1
  updated_at: 2026-05-01
  reviewed_by: ops

- doc_id: KB-PAY-006
  doc_type: guide
  module: payment
  title: 支付渠道与发票
  content: |
    · 支付渠道：支持微信支付、支付宝、银行卡、企业转账等，具体以 App 内可选项为准。
    · 缴费记录：在"我的—缴费记录"查看所有历史账单与缴费状态。
    · 发票：可通过 App 提交开票申请，电子发票一般在 5 个工作日内开具。
    · 抬头与税号：开票前请准备好抬头、纳税人识别号，企业用户还需开户行与账号。
    如发票信息错误，请在收到发票后及时申请重开。
  tags: [支付渠道, 发票]
  version: 1
  updated_at: 2026-05-01
  reviewed_by: ops

- doc_id: KB-PAY-007
  doc_type: faq
  module: payment
  title: 缴费失败怎么办
  content: |
    缴费失败的常见原因与处理：
    · 余额不足：请确认支付账户有足够余额。
    · 银行卡限额：部分银行卡有单笔或单日限额，可联系发卡行调整。
    · 网络异常：检查网络连接后重试。
    · 支付渠道维护：微信或支付宝偶尔维护，稍后重试。
    · 连续失败：可更换支付方式（如换一张银行卡）再试。
    如多次尝试仍失败，请联系门店确认账单状态或寻求帮助。
  tags: [缴费, 失败, 支付]
  version: 1
  updated_at: 2026-05-02
  reviewed_by: ops

- doc_id: KB-PAY-008
  doc_type: guide
  module: payment
  title: 如何查看缴费记录
  content: |
    查看缴费记录的方法：
    1. 进入"我的—缴费记录"；
    2. 可按时间筛选查看历史账单；
    3. 每笔记录显示缴费金额、缴费时间、支付方式与状态。
    · 已缴费的账单显示"已完成"；
    · 待缴费的账单显示"待支付"，点击可直接缴费；
    · 逾期未缴的会有特殊标识。
    缴费记录可作为报销或财务对账的参考依据。
  tags: [缴费记录, 查看, 账单]
  version: 1
  updated_at: 2026-05-02
  reviewed_by: ops

- doc_id: KB-PAY-009
  doc_type: faq
  module: payment
  title: 押金退还时间与方式
  content: |
    关于押金退还：
    · 退还时间：退租清算确认后，按合同约定时限退还，通常为 7—15 个工作日。
    · 退还方式：原路退回到原支付账户（如微信、支付宝、银行卡）。
    · 扣减项：水电欠费、房屋损坏赔偿、未归还钥匙等会从押金中扣除。
    · 退还明细：在退租清算单中列明每一项扣减与最终退还金额。
    超过约定时间未收到退还的，请联系门店查询进度。
  tags: [押金, 退还, 时间]
  version: 1
  updated_at: 2026-05-02
  reviewed_by: ops

- doc_id: KB-PAY-010
  doc_type: faq
  module: payment
  title: 可以提前预付多个月房租吗
  content: |
    关于预付房租：
    · 支持按合同约定的支付周期预付，如季付、半年付、年付。
    · 预付多个周期通常可享受租金优惠，具体优惠幅度以房源详情为准。
    · 预付后如需提前退租，剩余周期的处理按合同约定执行。
    · 预付金额与优惠在签约时确定，后续周期不再单独议价。
    如需了解预付优惠详情，可在 AI 助手中询问或联系门店。
  tags: [预付, 优惠, 年付]
  version: 1
  updated_at: 2026-05-02
  reviewed_by: ops
