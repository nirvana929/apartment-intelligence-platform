# 模块：签约 / 租约 / 续约 / 退租
# 前缀：KB-LS-

- doc_id: KB-LS-001
  doc_type: flow
  module: lease
  title: 签约的标准流程
  content: |
    签约通常包含以下步骤：
    1. 看房并选定房源；
    2. 与门店核对租金、押金、租期、支付方式；
    3. 平台生成电子合同，租客在线预览；
    4. 完成实名认证后电子签署；
    5. 按约定支付首期房租与押金；
    6. 门店安排钥匙 / 门禁卡领取与入住；
    电子合同签署完成后可在"我的—我的租约"查看。
    若需纸质合同副本，可联系门店打印。
  tags: [签约, 流程]
  version: 1
  updated_at: 2026-05-01
  reviewed_by: ops

- doc_id: KB-LS-002
  doc_type: rule
  module: lease
  title: 签约需要准备的材料
  content: |
    · 签约人本人的有效身份证件
    · 已完成实名认证的 App 账号
    · 用于支付首期房租与押金的电子支付方式或银行卡
    · 如委托他人签约，需提供经签字的授权委托书与双方身份证原件
    · 部分公寓在签约时可能要求提供工作证明或在校证明，
      具体以门店通知为准
    所有材料只用于本次签约登记，不会用于其他用途。
  tags: [材料, 签约]
  version: 1
  updated_at: 2026-05-01
  reviewed_by: ops

- doc_id: KB-LS-003
  doc_type: rule
  module: lease
  title: 租期选择与起租日
  content: |
    · 常见租期：3 个月 / 6 个月 / 12 个月，部分房源支持自定义。
    · 起租日：通常为签约当日或签约后约定的入住日，最迟不超过签约日 + 7 天。
    · 起租日确定后，租金按月计算；不足整月按天数折算。
    · 不同租期可能对应不同的押金或服务费比例，详见租金明细。
    · 如对租期或起租日有疑问，可在签约前与门店确认。
  tags: [租期, 起租日]
  version: 1
  updated_at: 2026-05-01
  reviewed_by: ops

- doc_id: KB-LS-004
  doc_type: guide
  module: lease
  title: 在线查看我的租约
  content: |
    在"我的—我的租约"可查看以下信息：
    · 签约公寓与房间号
    · 起租日与到期日
    · 租金、押金、支付方式
    · 当前租约状态（已生效 / 即将到期 / 已结束）
    · 距到期剩余天数与可续约时间窗
    · 电子合同 PDF 下载入口
    AI 助手也支持租约相关查询，例如"我的租约什么时候到期"，
    返回的内容仅来自当前登录用户的租约数据，不会展示他人信息。
  tags: [租约, 查看]
  version: 1
  updated_at: 2026-05-01
  reviewed_by: ops

- doc_id: KB-LS-005
  doc_type: policy
  module: lease
  title: 续约政策与时间窗
  content: |
    · 续约时间窗：到期前 30 天内可在 App 内提交续约意向。
    · 续约价格：续约时门店会重新评估房源市场价，可能与原合同不同；最终以续约合同为准。
    · 续约流程：提交意向 → 门店确认价格与租期 → 平台生成新合同 → 电子签署 → 衔接续租。
    · 不办理续约：到期前请按合同约定办理退租，否则可能产生超期费用。
    · AI 助手目前仅支持续约咨询，正式办理需通过 App 续约入口或门店。
  tags: [续约, 时间窗]
  version: 1
  updated_at: 2026-05-01
  reviewed_by: ops

- doc_id: KB-LS-006
  doc_type: flow
  module: lease
  title: 正常退租流程
  content: |
    租约自然到期或按合同约定到期时：
    1. 到期前 7 天，App 与门店会主动提醒并约定退租时间；
    2. 提前清理个人物品，配合门店进行水电气抄表与房屋验收；
    3. 门店出具退租清算单，列明押金返还与扣减项；
    4. 租客与门店双方确认后，押金按合同约定时限退还到原支付账户。
    具体扣减项以合同与现场验收单为准；
    如对清算结果有异议，可申请复核。
  tags: [退租, 正常]
  version: 1
  updated_at: 2026-05-01
  reviewed_by: ops

- doc_id: KB-LS-007
  doc_type: policy
  module: lease
  title: 提前退租与违约金
  content: |
    提前退租按合同约定执行，常见情形：
    · 距到期 ≤ 30 天：按原条款办理退租，押金按清算单返还。
    · 距到期 > 30 天：可能扣除一个月房租作为违约金，剩余押金退还。
    · 因合同约定的不可抗力或房源问题导致退租：根据合同条款减免违约金。
    实际扣减以你签订的合同为准，建议在申请前先咨询门店。
    AI 助手仅提供条款查询，不直接办理退租。
  tags: [提前退租, 违约金]
  version: 1
  updated_at: 2026-05-01
  reviewed_by: ops
