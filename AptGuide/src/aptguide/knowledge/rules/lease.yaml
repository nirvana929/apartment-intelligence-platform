# 模块：签约 / 租约 / 续约 / 退租
# 前缀：KB-LS-

- doc_id: KB-LS-001
  doc_type: flow
  module: lease
  title: 签约的标准流程
  content: |
    签约通常包含以下步骤：
    1. 看房并选定房源；
    2. 与门店核对租金、押金、租期、支付方式；
    3. 平台生成电子合同，租客在线预览；
    4. 完成实名认证后电子签署；
    5. 按约定支付首期房租与押金；
    6. 门店安排钥匙 / 门禁卡领取与入住；
    电子合同签署完成后可在"我的—我的租约"查看。
    若需纸质合同副本，可联系门店打印。
  tags: [签约, 流程]
  version: 1
  updated_at: 2026-05-01
  reviewed_by: ops

- doc_id: KB-LS-002
  doc_type: rule
  module: lease
  title: 签约需要准备的材料
  content: |
    · 签约人本人的有效身份证件
    · 已完成实名认证的 App 账号
    · 用于支付首期房租与押金的电子支付方式或银行卡
    · 如委托他人签约，需提供经签字的授权委托书与双方身份证原件
    · 部分公寓在签约时可能要求提供工作证明或在校证明，
      具体以门店通知为准
    所有材料只用于本次签约登记，不会用于其他用途。
  tags: [材料, 签约]
  version: 1
  updated_at: 2026-05-01
  reviewed_by: ops

- doc_id: KB-LS-003
  doc_type: rule
  module: lease
  title: 租期选择与起租日
  content: |
    · 常见租期：3 个月 / 6 个月 / 12 个月，部分房源支持自定义。
    · 起租日：通常为签约当日或签约后约定的入住日，最迟不超过签约日 + 7 天。
    · 起租日确定后，租金按月计算；不足整月按天数折算。
    · 不同租期可能对应不同的押金或服务费比例，详见租金明细。
    · 如对租期或起租日有疑问，可在签约前与门店确认。
  tags: [租期, 起租日]
  version: 1
  updated_at: 2026-05-01
  reviewed_by: ops

- doc_id: KB-LS-004
  doc_type: guide
  module: lease
  title: 在线查看我的租约
  content: |
    在"我的—我的租约"可查看以下信息：
    · 签约公寓与房间号
    · 起租日与到期日
    · 租金、押金、支付方式
    · 当前租约状态（已生效 / 即将到期 / 已结束）
    · 距到期剩余天数与可续约时间窗
    · 电子合同 PDF 下载入口
    AI 助手也支持租约相关查询，例如"我的租约什么时候到期"，
    返回的内容仅来自当前登录用户的租约数据，不会展示他人信息。
  tags: [租约, 查看]
  version: 1
  updated_at: 2026-05-01
  reviewed_by: ops

- doc_id: KB-LS-005
  doc_type: policy
  module: lease
  title: 续约政策与时间窗
  content: |
    · 续约时间窗：到期前 30 天内可在 App 内提交续约意向。
    · 续约价格：续约时门店会重新评估房源市场价，可能与原合同不同；最终以续约合同为准。
    · 续约流程：提交意向 → 门店确认价格与租期 → 平台生成新合同 → 电子签署 → 衔接续租。
    · 不办理续约：到期前请按合同约定办理退租，否则可能产生超期费用。
    · AI 助手目前仅支持续约咨询，正式办理需通过 App 续约入口或门店。
  tags: [续约, 时间窗]
  version: 1
  updated_at: 2026-05-01
  reviewed_by: ops

- doc_id: KB-LS-006
  doc_type: flow
  module: lease
  title: 正常退租流程
  content: |
    租约自然到期或按合同约定到期时：
    1. 到期前 7 天，App 与门店会主动提醒并约定退租时间；
    2. 提前清理个人物品，配合门店进行水电气抄表与房屋验收；
    3. 门店出具退租清算单，列明押金返还与扣减项；
    4. 租客与门店双方确认后，押金按合同约定时限退还到原支付账户。
    具体扣减项以合同与现场验收单为准；
    如对清算结果有异议，可申请复核。
  tags: [退租, 正常]
  version: 1
  updated_at: 2026-05-01
  reviewed_by: ops

- doc_id: KB-LS-007
  doc_type: policy
  module: lease
  title: 提前退租与违约金
  content: |
    提前退租按合同约定执行，常见情形：
    · 距到期 ≤ 30 天：按原条款办理退租，押金按清算单返还。
    · 距到期 > 30 天：可能扣除一个月房租作为违约金，剩余押金退还。
    · 因合同约定的不可抗力或房源问题导致退租：根据合同条款减免违约金。
    实际扣减以你签订的合同为准，建议在申请前先咨询门店。
    AI 助手仅提供条款查询，不直接办理退租。
  tags: [提前退租, 违约金]
  version: 1
  updated_at: 2026-05-01
  reviewed_by: ops

- doc_id: KB-LS-008
  doc_type: faq
  module: lease
  title: 租约到期未续约会怎样
  content: |
    租约到期且未办理续约或退租的情况：
    · 到期前 30 天起，App 与门店会多次提醒续约或退租。
    · 到期后如继续居住且未办理任何手续，可能按合同约定产生超期费用。
    · 超期居住期间的租金通常按日计算，费率可能高于正常租金。
    · 建议在到期前明确是续约还是退租，避免额外费用。
    具体超期处理方式以合同约定为准。
  tags: [到期, 超期, 续约]
  version: 1
  updated_at: 2026-05-02
  reviewed_by: ops

- doc_id: KB-LS-009
  doc_type: guide
  module: lease
  title: 如何查看和下载电子合同
  content: |
    查看和下载电子合同的步骤：
    1. 进入"我的—我的租约"；
    2. 点击对应租约进入详情页；
    3. 找到"电子合同"或"合同下载"入口；
    4. 下载 PDF 格式的合同文件。
    电子合同与纸质合同具有同等效力。
    如无法下载或文件损坏，请联系门店重新发送。
    建议下载后妥善保存，退租清算时可作为参考依据。
  tags: [电子合同, 下载, PDF]
  version: 1
  updated_at: 2026-05-02
  reviewed_by: ops

- doc_id: KB-LS-010
  doc_type: rule
  module: lease
  title: 换房与租约变更
  content: |
    关于换房和租约变更：
    · 换房：如需更换到同公寓其他房间，需与门店协商，可能涉及新的签约流程。
    · 租期变更：缩短或延长租期需双方协商同意并签订补充协议。
    · 支付方式变更：可在续约时调整，生效中的合同一般不支持中途变更。
    · 换房可能涉及搬家费、差价结算等，具体以门店协商结果为准。
    AI 助手可协助查询换房政策，正式办理需通过门店。
  tags: [换房, 变更, 租约]
  version: 1
  updated_at: 2026-05-02
  reviewed_by: ops

- doc_id: KB-LS-011
  doc_type: faq
  module: lease
  title: 签约后可以反悔吗
  content: |
    关于签约后的反悔：
    · 电子合同签署后即生效，双方均需按合同执行。
    · 部分公寓提供签约后短暂冷静期（如 24 小时），具体以合同条款为准。
    · 超过冷静期后退租的，按提前退租条款处理，可能产生违约金。
    · 如因房源信息严重不符（如户型、面积与描述差异大），可与门店协商处理。
    签约前请仔细阅读合同条款，确认无误后再签署。
  tags: [反悔, 冷静期, 签约]
  version: 1
  updated_at: 2026-05-02
  reviewed_by: ops

- doc_id: KB-LS-012
  doc_type: guide
  module: lease
  title: 租约相关问题咨询渠道
  content: |
    遇到租约相关问题可通过以下渠道咨询：
    · AI 助手：支持租约查询、续约咨询、退租政策等常见问题。
    · App 内"意见反馈"：提交后运营人员会在 3 个工作日内回复。
    · 门店电话：紧急或复杂问题建议直接联系签约门店。
    · 线下到店：可预约到门店面对面沟通。
    AI 助手仅提供信息查询，涉及签约、退租等正式操作需通过门店办理。
  tags: [咨询, 渠道, 租约]
  version: 1
  updated_at: 2026-05-02
  reviewed_by: ops
