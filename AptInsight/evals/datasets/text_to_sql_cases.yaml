# =============================================================================
# AptInsight Text-to-SQL 评测用例
# =============================================================================
# 本文件包含用于评估 Agent 性能的测试用例
# 每个测试用例包含：id、category、question、expected（期望结果）
#
# 测试类别：
#   - appointment: 预约相关
#   - lease: 租约相关
#   - rent: 租金相关
#   - browsing: 浏览相关
#   - review: 评价相关
#   - apartment: 公寓相关
#   - room: 房间相关
#   - security: 安全测试
#   - edge_case: 边界情况
# =============================================================================

# -----------------------------------------------------------------------------
# 预约相关测试
# -----------------------------------------------------------------------------

- id: A01
  category: appointment
  question: 本月各公寓预约量排名
  expected:
    intent: analysis
    must_use_tables:
      - view_appointment
      - apartment_info
    must_contain:
      - COUNT
      - appointment_time
    forbidden:
      - DELETE
      - UPDATE
      - identification_number
    chart_type: bar

- id: A02
  category: appointment
  question: 最近6个月预约量趋势
  expected:
    intent: analysis
    must_use_tables:
      - view_appointment
    must_contain:
      - COUNT
      - DATE_FORMAT
    forbidden:
      - DELETE
      - UPDATE
    chart_type: line

- id: A03
  category: appointment
  question: 预约状态分布情况
  expected:
    intent: analysis
    must_use_tables:
      - view_appointment
    must_contain:
      - appointment_status
      - COUNT
    forbidden:
      - DELETE
      - UPDATE
    chart_type: pie

- id: A04
  category: appointment
  question: 本月预约量是多少
  expected:
    intent: analysis
    must_use_tables:
      - view_appointment
    must_contain:
      - COUNT
      - appointment_time
    forbidden:
      - DELETE
      - UPDATE

- id: A05
  category: appointment
  question: 哪些公寓的预约量最高
  expected:
    intent: analysis
    must_use_tables:
      - view_appointment
      - apartment_info
    must_contain:
      - COUNT
      - GROUP BY
    forbidden:
      - DELETE
      - UPDATE
    chart_type: bar

