[project]
name = "aptguide3"
version = "0.1.0"
description = "LLM-first rental assistant backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "openai>=1.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pymilvus>=2.4.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
