<svg width="1600" height="1180" viewBox="0 0 1600 1180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font: 700 38px "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #172033; }
      .subtitle { font: 400 18px "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #667085; }
      .lane-title { font: 700 22px "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #1F2937; }
      .node-title { font: 700 17px "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #263244; }
      .node-text { font: 400 13px "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #4B5563; }
      .tiny { font: 400 12px "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #667085; }
      .tag { font: 700 13px "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #344054; }
    </style>
    <marker id="ag-flow-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475467"/>
    </marker>
    <marker id="ag-flow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7C3AED"/>
    </marker>
    <marker id="ag-flow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#059669"/>
    </marker>
    <marker id="ag-flow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563EB"/>
    </marker>
  </defs>

  <rect width="1600" height="1180" rx="32" fill="#F7F8FA"/>
  <rect x="48" y="46" width="1504" height="1088" rx="26" fill="#FFFFFF" stroke="#D7DCE2" stroke-width="2"/>

  <text x="800" y="105" text-anchor="middle" class="title">AptGuide 3.0 LangGraph 功能流程图</text>
  <text x="800" y="140" text-anchor="middle" class="subtitle">模型优先理解、过程化分支、RAG 检索增强、确认式写操作和可追踪响应生成</text>

  <rect x="86" y="188" width="210" height="74" rx="15" fill="#ECFDF3" stroke="#8DD7A5" stroke-width="2"/>
  <text x="191" y="218" text-anchor="middle" class="node-title">用户消息</text>
  <text x="191" y="243" text-anchor="middle" class="node-text">租客找房、咨询、预约</text>

  <rect x="350" y="188" width="230" height="74" rx="15" fill="#F9FAFB" stroke="#CBD5E1" stroke-width="2"/>
  <text x="465" y="218" text-anchor="middle" class="node-title">会话和安全边界</text>
  <text x="465" y="243" text-anchor="middle" class="node-text">加载状态、拦截高风险输入</text>

  <rect x="634" y="188" width="246" height="74" rx="15" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="2"/>
  <text x="757" y="218" text-anchor="middle" class="node-title">LLM-first 理解</text>
  <text x="757" y="243" text-anchor="middle" class="node-text">意图、任务、偏好、风险</text>

  <rect x="934" y="188" width="230" height="74" rx="15" fill="#FEF3C7" stroke="#FBBF24" stroke-width="2"/>
  <text x="1049" y="218" text-anchor="middle" class="node-title">结构化校验</text>
  <text x="1049" y="243" text-anchor="middle" class="node-text">低置信度或矛盾则澄清</text>

  <rect x="1218" y="188" width="246" height="74" rx="15" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="2"/>
  <text x="1341" y="218" text-anchor="middle" class="node-title">Procedure Runtime</text>
  <text x="1341" y="243" text-anchor="middle" class="node-text">按 route 和 task 分发节点</text>

