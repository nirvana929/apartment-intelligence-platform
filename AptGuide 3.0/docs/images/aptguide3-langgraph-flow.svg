  <path d="M1341 262V292H281V322" stroke="#475467" stroke-width="3" marker-end="url(#ag-flow-arrow)"/>
  <path d="M1341 262V292H780V322" stroke="#059669" stroke-width="3" marker-end="url(#ag-flow-green)"/>
