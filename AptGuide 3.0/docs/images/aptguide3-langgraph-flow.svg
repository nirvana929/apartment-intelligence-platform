  <rect x="1128" y="804" width="342" height="52" rx="12" fill="#FEF3C7" stroke="#FBBF24"/>
  <text x="1299" y="836" text-anchor="middle" class="node-title">置信度和风险门控</text>

  <rect x="1128" y="880" width="342" height="52" rx="12" fill="#DBEAFE" stroke="#93B5FD"/>
