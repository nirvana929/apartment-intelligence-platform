  <text x="520" y="286" class="tiny">校验失败或意图不清</text>

  <rect x="536" y="976" width="488" height="64" rx="15" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="2"/>
  <text x="780" y="1003" text-anchor="middle" class="node-title">Response Composer</text>
  <text x="780" y="1026" text-anchor="middle" class="node-text">统一生成消息、卡片、动作、待确认状态和元数据</text>

  <rect x="1084" y="976" width="430" height="64" rx="15" fill="#F9FAFB" stroke="#CBD5E1" stroke-width="2"/>
  <text x="1299" y="1003" text-anchor="middle" class="node-title">Trace 和状态持久化</text>
