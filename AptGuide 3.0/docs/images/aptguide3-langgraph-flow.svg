  <rect x="113" y="1074" width="1374" height="42" rx="12" fill="#FFFBEB" stroke="#FDE68A"/>
  <text x="800" y="1101" text-anchor="middle" class="tag">功能图重点：展示 LangGraph 节点和分支职责，不展开代码变量；RAG 子链路保留 Query 改写、向量召回、重排/排序、风险门控和证据输出。</text>
