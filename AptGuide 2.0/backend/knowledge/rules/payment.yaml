- doc_id: KB-PAY-001
  doc_type: rule
  module: payment
  title: 支付方式说明
  content: |
    支持的支付方式包括：在线支付（微信、支付宝）、银行转账和门店现场支付。
    具体可用支付方式以门店和系统实际支持为准。
    建议优先使用在线支付，便于记录和查询。
  tags: [支付, 方式, 在线]
  version: 1
  risk_level: low
  status: reviewed
  reviewed_by: ops
  updated_at: 2026-05-11

- doc_id: KB-PAY-002
  doc_type: rule
  module: payment
  title: 租金缴纳周期
  content: |
    租金缴纳周期通常为月付，部分房源支持季付或半年付。
    具体缴纳周期和金额以合同约定为准。
    不同缴纳周期可能对应不同的优惠政策，建议签约前了解。
  tags: [租金, 周期, 缴纳]
  version: 1
  risk_level: medium
  status: reviewed
  reviewed_by: ops
  updated_at: 2026-05-11

- doc_id: KB-PAY-003
  doc_type: rule
  module: payment
  title: 账单生成与查看
  content: |
    系统每月自动生成账单，包含租金、水电费、物业费等明细。
    用户可在个人中心查看当期账单和历史账单记录。
    账单生成后会通过消息通知用户，请及时查看并按时缴纳。
  tags: [账单, 查看, 明细]
  version: 1
  risk_level: low
  status: reviewed
  reviewed_by: ops
  updated_at: 2026-05-11

- doc_id: KB-PAY-004
  doc_type: rule
  module: payment
  title: 逾期缴费规则
  content: |
    超过合同约定缴费日期未缴纳租金视为逾期。
    逾期可能产生滞纳金，具体金额和计算方式以合同约定为准。
    长期逾期可能影响个人信用记录和续租资格。
  tags: [逾期, 滞纳金, 缴费]
  version: 1
  risk_level: high
  status: reviewed
  reviewed_by: ops
  updated_at: 2026-05-11

- doc_id: KB-PAY-005
  doc_type: rule
  module: payment
  title: 水电费计费规则
  content: |
    水电费按实际使用量计费，费率以当地标准和合同约定为准。
    水电表读数定期抄录，费用纳入月度账单。
    对读数或费用有异议可联系门店核实。
  tags: [水电, 计费, 费用]
  version: 1
  risk_level: low
  status: reviewed
  reviewed_by: ops
  updated_at: 2026-05-11

- doc_id: KB-PAY-006
  doc_type: rule
  module: payment
  title: 物业费说明
  content: |
    物业费涵盖公共区域维护、安保、保洁和基础维修等服务。
    物业费标准由物业公司制定，包含在月度账单中。
    物业服务范围和标准详见物业服务合同或门店说明。
  tags: [物业费, 服务, 公共]
  version: 1
  risk_level: low
  status: reviewed
  reviewed_by: ops
  updated_at: 2026-05-11

- doc_id: KB-PAY-007
  doc_type: rule
  module: payment
  title: 发票开具说明
  content: |
    租金发票可在缴费后申请开具，支持电子发票和纸质发票。
    开票信息需提供准确的抬头和税号，申请后按流程处理。
    具体开票规则和时间以门店和财务部门安排为准。
  tags: [发票, 开票, 报销]
  version: 1
  risk_level: low
  status: reviewed
  reviewed_by: ops
  updated_at: 2026-05-11

- doc_id: KB-PAY-008
  doc_type: rule
  module: payment
  title: 缴费记录查询
  content: |
    用户可在个人中心查看所有缴费记录，包括租金、押金和其他费用。
    缴费记录包含：缴费时间、金额、支付方式和交易状态。
    如对缴费记录有疑问，可联系门店或客服核实。
  tags: [记录, 查询, 缴费]
  version: 1
  risk_level: low
  status: reviewed
  reviewed_by: ops
  updated_at: 2026-05-11

- doc_id: KB-PAY-009
  doc_type: rule
  module: payment
  title: 退费处理规则
  content: |
    多缴费用或符合条件的退费将在核实后原路退回。
    退费处理时间因支付渠道不同而有所差异，通常需要 3 至 15 个工作日。
    退费进度可联系门店或客服查询。
  tags: [退费, 退款, 处理]
  version: 1
  risk_level: medium
  status: reviewed
  reviewed_by: ops
  updated_at: 2026-05-11

- doc_id: KB-PAY-010
  doc_type: rule
  module: payment
  title: 优惠减免使用规则
  content: |
    优惠减免以活动规则和合同约定为准，不可叠加使用的情况会提前说明。
    优惠减免金额在账单中单独列示，不影响实际应付金额的计算。
    过期或不符合条件的优惠无法使用。
  tags: [优惠, 减免, 活动]
  version: 1
  risk_level: low
  status: reviewed
  reviewed_by: ops
  updated_at: 2026-05-11
